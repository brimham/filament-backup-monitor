name: Fix PHP code style issues

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  php-code-styling:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.head_ref }}

      - name: Fix PHP code style issues
        uses: aglipanci/laravel-pint-action@22dd72142d98a0dc7cfc31692514ea4c87eb4f13 # 2.5

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403 # v5.2.0
        with:
          commit_message: Fix styling
